# node-ts-mongo@1 — THE blueprint faculty applications are generated from.
#
# §20 calls a blueprint "a security multiplier": whatever is here is replicated
# into every application, so its auth component is written once and inherited,
# and a vulnerability in it is a vulnerability in all of them. That is why the
# skeleton's SAML wiring reads §8's contract and nothing else — no literal URLs,
# no fallbacks — and why every app-side library is pinned to an exact version.
blueprint: node-ts-mongo
major_version: 1
schema_versions: [1]

runtime:
  language: typescript
  # The SAME image fixture-node@1 pins, and pinned at the LOCAL REGISTRY, which
  # is the only place an offline build can resolve it from (S1). It is NOT the
  # digest in infra/images.lock: that records what Docker Hub returned (a
  # multi-arch index); `docker pull` on arm64 takes a single-arch manifest out
  # of it and `docker push` republishes that.
  #
  # Measured 2026-09-09 off the registry's own storage rather than copied:
  #   docker exec manifest-registry cat \
  #     /var/lib/registry/docker/registry/v2/repositories/base/node/_manifests/tags/22-alpine/current/link
  #   -> sha256:1ef15d33d74602021f35ec64a4e72f4a21e2cfa68ebecd125fbe0c44af8f604a
  #
  # Re-measure after any `make seed`. Moving the app-side base image to Node 24
  # is open and is Rich's call (ORIENTATION §8); this blueprint does not decide it.
  base_image: manifest-registry:5000/base/node@sha256:1ef15d33d74602021f35ec64a4e72f4a21e2cfa68ebecd125fbe0c44af8f604a
  default_port: 3000
  health_path: /healthz
  # The Dockerfile creates a user AND a group with this number, and it is
  # load-bearing beyond "not root": §8's SP private key is placed 0440 owned by
  # root with THIS as its gid, and §12's `CapDrop: ALL` takes CAP_DAC_OVERRIDE
  # with it — so ownership is the only thing that can grant the read. The two
  # values are threaded from here through DeployDeps.blueprints (Task 11);
  # changing this number without changing the Dockerfile makes an app unable to
  # read its own signing key, and the symptom is a login that never completes.
  run_as_uid: 10001

provides:
  services: [mongo]
  # Both, deliberately. `none` is what a public app declares, and it is not a
  # lesser path: the skeleton starts, serves and reaches Mongo with no SAML
  # variables injected at all.
  auth_providers: [cwl, none]
  # TRUE since P4b Task 10, which wrote skeleton/ai/llm.js. It was false until
  # then (P4a Decision 12), so a spec declaring ai.models was refused by
  # checkBlueprintCompatibility rather than deployed with no key. The flip is
  # ADDITIVE: it permits more, so no app breaks and it is not a major bump.
  ai: true

defaults:
  resources:
    cpu: 0.5
    memory: 512Mi
    pids: 256
    disk: 2Gi

injection:
  # Must equal spec/injection.ts's INJECTION_CONTRACT_VERSION.
  # §8's mapping "is versioned with the blueprint"; a blueprint naming another
  # version is reading a different contract from the one the platform renders.
  contract: v1

dockerfile: ./Dockerfile.tmpl
knowledge_pack: ./agents/

# §25 Starters (P5a Task 10): complete apps a project can start from, laid over the
# skeleton at project creation and copied once — the project owns them from then on.
# Validated when this file is loaded, against §7 and against this descriptor, so a
# starter that cannot pass is never offered. The proof app is the first: it is §16's,
# which is what makes §22's step 6 — sign in, write a note, ask — reachable from a
# project a person created in the console.
starters:
  - name: proof-app
    path: ./starters/proof-app/
    summary: CWL sign-in, a private note, and a question answered from your notes

# What the skeleton installs, exactly (C6, D30). Ranges are refused by
# descriptorSchema: §16's drift test asserts against a stated version, and a
# range would let §8's contract drift underneath the test built to catch drift.
#
# THESE FIVE ARE MEASURED, NOT CHOSEN. This exact set — with the @xmldom/xmldom
# override below — is what fixtures/saml-sp installs, and that fixture completed
# a real CWL login against the Manifest IdP on 2026-09-08 and passes §12's scan
# gate. The plan's draft named express 4.21.2 and express-session 1.18.1; it was
# written on 2026-09-07, before the fixture existed, and its own step-1 test
# left express as a regex for this reason.
pinned_dependencies:
  express: 4.22.2
  express-session: 1.19.0
  passport: 0.7.0
  passport-ubcshib: 0.1.6
  mongodb: 6.12.0
  # P4b Task 10. The SAME version the control plane's devDependency pins, which
  # §16's AI-path tier and ai-component.test.ts run — a test holds the two equal.
  # Its closure carries @anthropic-ai/sdk, ollama and openai, two provider SDKs
  # this platform never uses, into every app's image and the mirror's warm set.
  # Accepted (measured 2026-09-07): C6 says Manifest adapts to the toolkit rather
  # than reshaping it.
  ubc-genai-toolkit-llm: 0.7.0
  # P4c Task 10: sessions in the app's own Mongo, so a redeploy signs nobody out
  # (skeleton/auth/session.js). 6.0.0 is the current release (published
  # 2025-11-30, re-checked 2026-09-16) and the evidence for it is fit, not
  # recency: its peers are what this list already pins (express-session ^1.17.1
  # against 1.19.0, mongodb >=5.0.0 against 6.12.0), its engine floor is Node
  # >=20.8 against the image's 22, and it adds seven packages to every app's
  # closure — kruptein 3.0.8, asn1.js, bn.js, minimalistic-assert, and its own
  # debug and ms. `npm audit` of the lockfile measured the same five findings
  # before and after the addition, none of them in that closure.
  connect-mongo: 6.0.0
