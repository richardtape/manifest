# Logical model names only (§7): an app never sees a vendor model id, and an admin
# repoints the whole fleet by changing one mapping.
#
# The catalogue is DB-held at runtime (STORE_MODEL_IN_DB); these entries are the
# bootstrap set. A config-file deployment cannot be deleted through the admin API
# at all, so anything expected to change lives in the database (S3 §Evidence 7).

model_list:
  - model_name: default-chat
    litellm_params:
      # qwen3.5:4b (Rich, 2026-09-24) IS A THINKING MODEL, and `think: false` is what makes it
      # usable — LOAD-BEARING, on both non-reasoning chat entries. Without it every token goes to
      # reasoning_content, which the app toolkit discards: 260 streamed frames, 0 with content, and no
      # error (measured 2026-09-24 — S3 Evidence 9 again). It is Ollama's own parameter, NOT
      # `reasoning_effort: none`, because a REQUEST's reasoning_effort overrode that (0 content in 233
      # frames): LiteLLM 1.98.0 maps a request's reasoning_effort to `think` first and copies these
      # provider params over it (utils.py:4268, then :4508), so an app asking for "high" still gets
      # content. The one thing that beats it is a request sending Ollama's own `think: true`. `make
      # verify`'s streaming check and ai-path.docker.test.ts go red if it is removed or weakened.
      model: ollama_chat/qwen3.5:4b
      api_base: http://host.docker.internal:11434
      think: false
      # SYNTHETIC COST — load-bearing. Ollama is free, so without it no budget is
      # ever reachable AND every per-user spend row reads $0.00, which makes D8's
      # attribution as untestable as §10's budgets (S3 §Evidence 4, 5).
      input_cost_per_token: 0.000001     # $1.00 / M input tokens
      output_cost_per_token: 0.000003    # $3.00 / M output tokens
    model_info:
      max_classification: internal       # D17; survives round-trip via /model/info

  - model_name: default-chat-onprem
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: http://host.docker.internal:11434
      think: false
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
    model_info:
      max_classification: confidential

  # THE REASONING VARIANTS (Rich, 2026-09-24): the SAME model with thinking ON, under its own logical
  # name, so choosing reasoning is a declared `ai.models` entry — a §7 sensitive field an administrator
  # sees on a launched app — never a request flag on the default. A request may send `reasoning_effort`
  # (none/low/medium/high); through Ollama, LiteLLM collapses low/medium/high to `think: true` (only
  # gpt-oss takes real levels), and they become real levels when an administrator repoints the name at a
  # model that has them. WHAT AN APP ACCEPTS: the toolkit discards reasoning_content, so it sees nothing
  # until thinking ends, and a small max_tokens is spent on thinking and answers EMPTY with no error
  # (measured 2026-09-24: 300 tokens → 0 content). Ask for enough tokens, or none at all.
  - model_name: default-chat-reasoning
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: http://host.docker.internal:11434
      reasoning_effort: medium
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
    model_info:
      max_classification: internal

  - model_name: default-chat-onprem-reasoning
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: http://host.docker.internal:11434
      reasoning_effort: medium
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
    model_info:
      max_classification: confidential

  - model_name: default-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0
    model_info:
      mode: embedding
      max_classification: internal

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # EXPLICIT, and load-bearing. The default is off, but when this key is ABSENT
  # from the YAML, LiteLLM prefers the value the admin UI wrote to the database —
  # so without this line one click starts retaining student prompts and the config
  # file will not override it (§7, S3 §Evidence 12).
  store_prompts_in_spend_logs: false
