<!-- @dsCard group="Foundations" height=320 subtitle="Label, hint, control, and a refusal in the platform\u2019s own words" -->
<div id="root" style="font-family: var(--font-sans); background: var(--surface-page); padding: 20px; box-sizing: border-box;"></div>
<script>
(function () {
  var h = React.createElement, M = window.Manifest;

  function Demo() {
    var s = React.useState('mock-app'), name = s[0], set = s[1];
    var taken = name.trim() === 'mock-app';
    var msg = name.trim() === '' ? undefined : (taken
      ? { tone: 'attention', title: 'a project already has this name', body: 'Pick another name, or ask its owner to add you.' }
      : { tone: 'steady', title: 'Yours. It will live at ' + name.trim() + '.manifest.internal' });
    return h('div', { style: { maxWidth: 560 } }, h(M.FormField, {
      id: 'mf-demo-name', label: 'What should we call it?',
      hint: 'Lower case, hyphens between words. This becomes its web address.',
      value: name, mono: true, message: msg,
      onChange: function (e) { set(e.target.value); } }));
  }
  var demo = h(Demo);
  ReactDOM.createRoot(document.getElementById('root')).render(demo);
})();
</script>
