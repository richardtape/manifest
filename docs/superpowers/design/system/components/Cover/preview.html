<!-- @dsCard height=300 -->
<style>
  .cv { position: relative; width: 960px; height: 300px; background: var(--surface-page); font-family: var(--font-sans); overflow: hidden; }
  .cv-art { position: absolute; inset: 0; }
  .cv-text { position: absolute; left: 64px; bottom: 44px; width: 440px; }
  .cv-name { margin: 0; font-size: 80px; line-height: 0.92; font-weight: 700; letter-spacing: -0.035em; color: var(--ink); }
  .cv-tag { margin: 14px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-subtle); }
  .tile { rx: var(--radius-lg); }
  .pill { rx: var(--radius-sm); fill: var(--surface-page); }
  .b-brand { fill: var(--brand); }
  .b-working { fill: var(--working); }
  .b-steady { fill: var(--steady); }
  .b-waiting { fill: var(--waiting); }
  .b-inverse { fill: var(--surface-inverse); }
</style>
<div class="cv">
  <!--
    blocks — brand 168x236, working 120x140, steady 120x80, waiting 96x96, surface-inverse 96x124; every corner rx var(--radius-lg)
    arrangement — one tall brand slab with four satellites in two columns, space-4 (16px) gutters, the whole group right of x=480
    pattern — pills, from "geometric, modular, dense UI: tiles cut by the radius tokens": every Manifest screen is state chips lying on cards, so the ground is cut back out of each block as radius-pill bars
    scales — gutters space-4 and space-5, block sides multiples of 4, pill height 12px with rx var(--radius-sm) = half the short side
  -->
  <svg class="cv-art" viewBox="0 0 960 300" width="960" height="300" aria-hidden="true" focusable="false">
    <rect class="tile b-brand"   x="512" y="32"  width="168" height="236"/>
    <rect class="tile b-working" x="696" y="32"  width="120" height="140"/>
    <rect class="tile b-steady"  x="696" y="188" width="120" height="80"/>
    <rect class="tile b-waiting" x="832" y="32"  width="96"  height="96"/>
    <rect class="tile b-inverse" x="832" y="144" width="96"  height="124"/>

    <rect class="pill" x="532" y="64"  width="128" height="12"/>
    <rect class="pill" x="532" y="92"  width="96"  height="12"/>
    <rect class="pill" x="532" y="120" width="112" height="12"/>
    <rect class="pill" x="532" y="148" width="72"  height="12"/>
    <rect class="pill" x="532" y="176" width="104" height="12"/>

    <rect class="pill" x="712" y="64"  width="88" height="12"/>
    <rect class="pill" x="712" y="88"  width="64" height="12"/>
    <rect class="pill" x="712" y="112" width="76" height="12"/>

    <rect class="pill" x="712" y="212" width="72" height="12"/>
    <rect class="pill" x="712" y="236" width="52" height="12"/>

    <rect class="pill" x="848" y="60"  width="64" height="12"/>
    <rect class="pill" x="848" y="84"  width="44" height="12"/>

    <rect class="pill" x="848" y="176" width="60" height="12"/>
    <rect class="pill" x="848" y="200" width="40" height="12"/>
  </svg>
  <div class="cv-text">
    <h1 class="cv-name">Manifest</h1>
    <p class="cv-tag">Describe it, and it runs at a UBC address.</p>
  </div>
</div>
