<!-- @dsCard group="States" height=190 subtitle="Drifting, done, and a clock that has not started" -->
<div id="root" style="font-family: var(--font-sans); background: var(--surface-page); padding: 20px; box-sizing: border-box;"></div>
<script>
(function () {
  var h = React.createElement, M = window.Manifest;

  var demo = h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },
    h(M.ProgressBar, { kind: 'working', value: 62, label: 'Working, a few minutes', meta: 'you can leave' }),
    h(M.ProgressBar, { kind: 'done', value: 100, label: 'Built', meta: '2 minutes 14 seconds' }),
    h('div', null,
      h('div', { style: { fontSize: 12.5, fontWeight: 600, color: 'var(--waiting)', marginBottom: 7 } }, 'A privacy assessment'),
      h(M.ProgressBar, { kind: 'clock' })));
  ReactDOM.createRoot(document.getElementById('root')).render(demo);
})();
</script>
